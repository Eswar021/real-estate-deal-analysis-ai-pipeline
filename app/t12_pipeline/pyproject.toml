[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "t12_pipeline"
version         = "0.1.0"
description     = "Real estate T12 financial statement mapping pipeline for Oakdale Capital."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where   = ["src"]
include = ["t12_pipeline*"]
