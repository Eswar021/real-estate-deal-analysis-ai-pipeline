[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "t12_pipeline"
version         = "0.1.0"
description     = "Real estate T12 financial statement mapping pipeline for Oakdale Capital."
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "langchain-core>=0.3",
    # llm_client imports all three providers at module level, so all three must install even
    # though every agent currently runs on Anthropic (see config/agent_llm_config.py).
    "langchain-anthropic>=0.3",
    "langchain-openai>=0.2",
    "langchain-google-genai>=2.0",
]

[tool.setuptools.packages.find]
where   = ["src"]
include = ["t12_pipeline*"]
